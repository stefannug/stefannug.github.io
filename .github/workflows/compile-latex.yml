name: Compile LaTeX CV
on:
  push:
    branches:
      - main  # Change to master if your default branch is named master
    paths:
      - 'cv.tex' # Only run when your CV text actually changes

permissions:
  contents: write

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex
          # Change compiler to xelatex or lualatex if your template uses special fonts
          compiler: pdflatex 

      - name: Commit and Push compiled PDF
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cv.pdf
          git commit -m "Automated update: Compiled fresh cv.pdf" || echo "No changes to commit"
          git push
